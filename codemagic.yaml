workflows:
  angebotspilot-ios-smoke:
    name: AngebotsPilot iOS – Native v0.6.0 Simulator Smoke Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Unpack native iOS source
        script: |
          cd "$CM_BUILD_DIR"
          rm -rf native
          unzip -q AngebotsPilot-Native-Source-v0.6.0.zip -d .
      - name: Install Capacitor dependencies
        script: |
          cd "$CM_BUILD_DIR/native"
          npm install --no-audit --no-fund
      - name: Validate native source
        script: |
          cd "$CM_BUILD_DIR/native"
          npm run validate
      - name: Prepare AngebotsPilot web bundle
        script: |
          cd "$CM_BUILD_DIR/native"
          npm run prepare:web
      - name: Generate iOS project
        script: |
          cd "$CM_BUILD_DIR/native"
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          AP_PUSH_ENV=development npm run prepare:ios
          npx cap ls ios
          grep -q "angebotspilot" ios/App/App/Info.plist
          grep -q "MARKETING_VERSION = 0.6.0" ios/App/App.xcodeproj/project.pbxproj
          grep -q "aps-environment" ios/App/App/App.entitlements
      - name: Build unsigned iOS simulator app
        script: |
          cd "$CM_BUILD_DIR/native/ios/App"
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - native/ios/App/build/Build/Products/Debug-iphonesimulator/App.app/**

  angebotspilot-ios-testflight:
    name: AngebotsPilot iOS – Native v0.6.0 TestFlight Build
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - appstore_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.harunxaa.angebotspilot
      vars:
        AP_RELEASE_PLATFORM: ios
        AP_REQUIRE_SIGNING: "1"
        AP_PUSH_ENV: production
      node: 22
      xcode: latest
    scripts:
      - name: Unpack native iOS source
        script: |
          cd "$CM_BUILD_DIR"
          rm -rf native
          unzip -q AngebotsPilot-Native-Source-v0.6.0.zip -d .
      - name: Install Capacitor dependencies
        script: |
          cd "$CM_BUILD_DIR/native"
          npm install --no-audit --no-fund
      - name: Validate native source
        script: |
          cd "$CM_BUILD_DIR/native"
          npm run validate
          npm run release:preflight
      - name: Prepare AngebotsPilot web bundle
        script: |
          cd "$CM_BUILD_DIR/native"
          npm run prepare:web
      - name: Generate iOS project
        script: |
          cd "$CM_BUILD_DIR/native"
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          npm run prepare:ios
      - name: Apply App Store provisioning profile
        script: |
          cd "$CM_BUILD_DIR/native/ios/App"
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR/native/ios/App"
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App
    artifacts:
      - native/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false

  angebotspilot-android-smoke:
    name: AngebotsPilot Android – Native v0.6.0 Play Billing Smoke Build
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
      ubuntu: 24.04
    scripts:
      - name: Unpack native Android source
        script: |
          cd "$CM_BUILD_DIR"
          rm -rf native
          unzip -q AngebotsPilot-Native-Source-v0.6.0.zip -d .
      - name: Install Capacitor dependencies
        script: |
          cd "$CM_BUILD_DIR/native"
          npm install --no-audit --no-fund
      - name: Validate native source
        script: |
          cd "$CM_BUILD_DIR/native"
          npm run validate
      - name: Prepare AngebotsPilot web bundle
        script: |
          cd "$CM_BUILD_DIR/native"
          npm run prepare:web
      - name: Generate Android project
        script: |
          cd "$CM_BUILD_DIR/native"
          rm -rf android
          npx cap add android
          npx cap sync android
          npm run prepare:android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          npx cap ls android
          grep -q 'android:scheme="angebotspilot"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:windowSoftInputMode="adjustResize"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          grep -q 'versionName "0.6.0"' android/app/build.gradle
      - name: Build unsigned Android debug APK
        script: |
          cd "$CM_BUILD_DIR/native/android"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - native/android/app/build/outputs/apk/debug/*.apk
