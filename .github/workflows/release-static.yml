name: Release static checks
on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Runtime versions
        run: |
          python3 --version
          node --version
      - name: Static checks
        run: python3 tests/release_static.py

      - name: Base invoice regression tests
        run: node --test tests/invoice-base.test.mjs

      - name: Store billing regression tests
        run: node --test tests/store-billing.test.mjs

      - name: Repository sync regression tests
        run: node --test tests/repository-sync.test.mjs

      - name: Cloud pagination regression tests
        run: node --test tests/cloud-pagination.test.mjs

      - name: Atomic offer line regression tests
        run: node --test tests/offer-lines.test.mjs

      - name: Atomic job assignment regression tests
        run: node --test tests/job-assignments.test.mjs

      - name: Local backup safety regression tests
        run: node --test tests/backup-preview.test.mjs

      - name: Voice API cost guard regression tests
        run: node --test tests/voice-api-cost.test.mjs

      - name: Stripe webhook safety regression tests
        run: node --test tests/stripe-webhook-safety.test.mjs

      - name: Stripe checkout guard regression tests
        run: node --test tests/stripe-checkout-guard.test.mjs

      - name: Stripe event inbox regression tests
        run: node --test tests/stripe-event-inbox.test.mjs

      - name: Storage quota notice regression tests
        run: node --test tests/storage-quota-notice.test.mjs

      - name: Secret scanner regression tests
        run: python3 tests/secret_scan_test.py
      - name: Scan tracked source and archives for privileged secrets
        run: python3 tests/secret_scan.py

      - name: Cloud account context regression tests
        run: node --test tests/cloud-context-guard.test.mjs

      - name: Deleted record conflict regression tests
        run: node --test tests/cloud-deletion-conflict.test.mjs
